<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie ma takiej strony · Chmielewski</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFBF8">
<script>(function(){var t;try{t=localStorage.getItem('chm-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  @font-face{font-family:"Albert Sans";src:url("/fonts/albert-sans.woff") format("woff");font-weight:400 700;font-display:swap}
  @font-face{font-family:"Cormorant Garamond";src:url("/fonts/cormorant-garamond.woff") format("woff");font-weight:500 700;font-display:swap}
  @font-face{font-family:"Cormorant Garamond";src:url("/fonts/cormorant-garamond-italic.woff") format("woff");font-weight:600;font-style:italic;font-display:swap}
  @font-face{font-family:"IBM Plex Mono";src:url("/fonts/ibm-plex-mono-500.woff") format("woff");font-weight:500;font-display:swap}
  :root{--paper:#FBFBF8;--ink:#232622;--stone:#62695D;--hop:#5A7234;--hop-deep:#26321A;--line:#DADFD1;color-scheme:light}
  :root[data-theme="dark"]{--paper:#0E120D;--ink:#EDF1E6;--stone:#A6AF9C;--hop:#A9C76E;--hop-deep:#1A2314;--line:#2A3426;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;align-content:center;padding:40px 20px;background:var(--paper);color:var(--ink);font:17px/1.6 "Albert Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:560px;margin-inline:auto}
  .brand{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:600 18px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
  .brand img{width:34px;height:auto;display:block}
  .brand .mk-d{display:none}[data-theme="dark"] .brand .mk-l{display:none}[data-theme="dark"] .brand .mk-d{display:block}
  .frame{position:relative;margin-top:40px;padding:34px 30px 30px}
  .frame i{position:absolute;width:22px;height:22px;border:2px solid var(--hop)}
  .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
  .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
  .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
  .label{margin:0;font:500 13px/1.4 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--hop)}
  h1{margin:12px 0 0;font:600 clamp(40px,9vw,60px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:-.02em;text-wrap:balance}
  h1 em{font-style:italic;color:var(--hop)}
  p.txt{margin:16px 0 0;color:var(--stone);max-width:30em;text-wrap:pretty}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:14px 22px;border-radius:999px;background:var(--hop);color:#fff;font:600 15px/1 "Albert Sans",sans-serif;text-decoration:none;transition:background .2s,scale .16s cubic-bezier(.23,1,.32,1)}
  [data-theme="dark"] .btn{background:#5A7234}
  @media (hover:hover) and (pointer:fine){.btn:hover{background:var(--hop-deep)}}
  @media (prefers-reduced-motion:no-preference){.btn:active{scale:.97}}
  .btn:focus-visible,.brand:focus-visible{outline:2px solid var(--hop);outline-offset:3px;border-radius:999px}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img class="mk-l" src="/mark.png" alt="" width="34" height="33"><img class="mk-d" src="/mark-light.png" alt="" width="34" height="33">Chmielewski</a>
  <div class="frame">
    <i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>
    <p class="label">Błąd 404</p>
    <h1>Tego kadru <em>tu nie ma</em></h1>
    <p class="txt">Strona mogła zmienić adres albo w linku jest literówka. Wszystko, czego szukasz, jest na stronie głównej.</p>
    <a class="btn" href="/">Wróć na stronę główną</a>
  </div>
</main>
</body>
</html>

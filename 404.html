<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nie ma takiej strony · Chmielewski</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10130F">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  @font-face{font-family:"Albert Sans";src:url("/fonts/albert-sans.woff") format("woff");font-weight:400 700;font-display:swap}
  @font-face{font-family:"Cormorant Garamond";src:url("/fonts/cormorant-garamond-italic.woff") format("woff");font-weight:600;font-style:italic;font-display:swap}
  @font-face{font-family:"IBM Plex Mono";src:url("/fonts/ibm-plex-mono-400.woff") format("woff");font-weight:400;font-display:swap}
  :root{--night:#10130F;--on-night:#ECEFE6;--on-night-2:#A3AC98;--lime:#B9DC7A;--lime-2:#CFE8A1;color-scheme:dark}
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100dvh;display:grid;align-content:center;padding:48px 20px calc(48px + env(safe-area-inset-bottom,0px));background:radial-gradient(900px circle at 85% 0%,rgba(185,220,122,.14),transparent 60%),var(--night);color:var(--on-night);font:17px/1.6 "Albert Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:640px;margin-inline:auto}
  .brand{display:inline-flex;align-items:center;gap:11px;color:inherit;text-decoration:none;font:650 16px/1 "Albert Sans",sans-serif;letter-spacing:.17em;text-transform:uppercase}
  .brand img{width:36px;height:auto;display:block}
  .label{margin:56px 0 0;font:400 12.5px/1.4 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
  h1{margin:16px 0 0;font:680 clamp(44px,11vw,84px)/.95 "Albert Sans",sans-serif;letter-spacing:-.045em;text-wrap:balance}
  h1 em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:1.14em;letter-spacing:-.01em;color:var(--lime)}
  p.txt{margin:22px 0 0;color:var(--on-night-2);max-width:34em;text-wrap:pretty}
  .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:999px;border:1px solid transparent;background:var(--lime);color:var(--night);font:600 16px/1 "Albert Sans",sans-serif;text-decoration:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .2s,border-color .2s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--on-night);border-color:rgba(236,239,230,.26)}
  @media (hover:hover) and (pointer:fine){.btn:hover{background:var(--lime-2)}.btn.ghost:hover{background:transparent;border-color:var(--on-night)}}
  @media (max-width:479px){.btn{flex:1 1 100%}}
  .btn:focus-visible,.brand:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:999px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/mark-light.png" alt="" width="36" height="35">Chmielewski</a>
  <p class="label">Błąd 404</p>
  <h1>Tego kadru <em>tu nie ma</em></h1>
  <p class="txt">Strona mogła zmienić adres albo w linku jest literówka. Wszystko, czego szukasz, jest na stronie głównej. Możesz też od razu zadzwonić.</p>
  <div class="ctas">
    <a class="btn" href="/">Wróć na stronę główną</a>
    <a class="btn ghost" href="tel:+48736842214">Zadzwoń: 736 842 214</a>
  </div>
</main>
</body>
</html>
